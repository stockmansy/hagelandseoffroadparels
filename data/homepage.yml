club:
  title: "Sportclub Fit & Move Kortenaken."
  description: "Leden van de club kunnen volgende sportbedrijvigheden beoefenen op recreatieve basis: fietsen en alle voorbereidende sporten zoals zwemmen, joggen, turnen, fitness. Maar de hoofdactiviteit is en blijft het off-road fietsen. De club is erkend als sportclub door de gemeente Kortenaken en door de provincie Vlaams-Brabant. Na vier succesvolle edities zullen we al het mogelijke doen om jullie optimaal te laten genieten van het mooie Hageland en de uitlopers richting Haspengouw."
  btn: "Contact"

