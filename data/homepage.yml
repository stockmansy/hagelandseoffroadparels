# About
about:
  title: "A.C. Hagelandse Off-Road Parels"
  subtitle: "zondag 11 april 2027 - in de bloesems"
  description: |
    **De vijfde editie van de "A.C. Hagelandse Off-Road Parels in de bloesems"!**

    Op zondag 11 april 2027 verwelkomen we jullie voor een prachtige off-road belevenis in het Hageland. Hopelijk kunnen we genieten van de kleurrijke bloesems van de fruitplantages! Het Hageland op zijn mooist!

    De MTB- en gravelparcours zijn grotendeels gescheiden, met voor beide disciplines een aangepaste omloop.

    Pittige klimmen wisselen af met adembenemende vergezichten. **75% off-road**, autoluwe verbindingslusjes en hellingen tot **16%** langs typische Hagelandse holle wegen.

    De MTB-parcours worden met pijltjes bewegwijzerd. De gravelroutes zijn uitsluitend beschikbaar via GPX.

    **Locatie:** Feestzaal Bergendal, Grote Vreunte 57, 3473 Kortenaken (Waanrode). In samenwerking met KOTK team Kortenaken.

  button:
    enable: true
    text: "Button"
    url: "#"
  image: "assets/img/Welkom.jpg"

previousedition:
  edition2026:
    title: "2026 Editie"
    description: |
      De vierde editie vond plaats op zondag 3 mei 2026 in Feestzaal Bergendal, Grote Vreunte 57, 3473 Kortenaken (Waanrode). De routes waren geschikt voor zowel MTB als gravel.

      | Afstand | Hoogtemeters | Klimmen | Bevoorradingen | Prijs |
      | --- | ---: | ---: | ---: | ---: |
      | 21 km | 200 m | 5 | 1 | €6 |
      | 40 km | 350 m | 7 | 1 | €6 |
      | 60 km | 700 m | 16 | 2 | €8 |
      | 75 km | 800 m | 21 | 2 | €8 |

      Inschrijving was ter plaatse van 8h00 tot 10h30. Een dagvergunning kostte €2 extra. Kinderen geboren in 2010 of later namen gratis deel en kregen een geschenkje. Er waren bevoorradingen, technische bijstand, een bewaakte fietsenstalling, een afspuitstand en douches.
  lasttitle: "2025 Editie"
